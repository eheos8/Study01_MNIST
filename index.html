<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>손글씨 숫자 인식</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#1c1c1a;--sub:#6b6a66;--line:#dcdad4;--acc:#2f6fed;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222220;--fg:#eeede8;--sub:#a3a29c;--line:#3a3a36;--acc:#6b9bff}}
:root[data-theme="dark"]{--bg:#161615;--card:#222220;--fg:#eeede8;--sub:#a3a29c;--line:#3a3a36;--acc:#6b9bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:20px 16px}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--sub);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
canvas{width:100%;aspect-ratio:1;background:#000;border-radius:10px;touch-action:none;display:block;cursor:crosshair}
.row{display:flex;gap:8px;margin-top:10px}
button,label.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);
font-size:15px;text-align:center;cursor:pointer;font-family:inherit}
button.main{background:var(--acc);border-color:var(--acc);color:#fff}
#상태{font-size:13px;color:var(--sub);margin-top:8px}
#결과{font-size:56px;font-weight:700;text-align:center;line-height:1.1}
#확신{text-align:center;color:var(--sub);font-size:13px;margin-bottom:10px}
.막대줄{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
.막대줄 .바탕{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.막대줄 .채움{height:100%;background:var(--acc);width:0}
.막대줄 .퍼센트{width:38px;text-align:right;color:var(--sub)}
</style>
</head>
<body>
<main>
  <h1>손글씨 숫자 인식</h1>
  <p class="sub">아래 검은 판에 0~9 숫자를 쓰고 '인식'을 누르세요.</p>

  <div class="card">
    <canvas id="판" width="280" height="280"></canvas>
    <div class="row">
      <button class="main" id="인식버튼">인식</button>
      <button id="지우기버튼">지우기</button>
    </div>
  </div>

  <div class="card">
    <div id="결과">?</div>
    <div id="확신">가중치를 불러온 뒤 인식해 보세요</div>
    <div id="막대들"></div>
  </div>

  <div class="card">
    <label class="btn" style="display:block">가중치 직접 선택 (mnist_cnn.json)
      <input type="file" id="파일" accept=".json" hidden>
    </label>
    <div id="상태">가중치를 불러오는 중…</div>
  </div>
</main>

<script>
// ---------------------------------------------------------------
// 1. 그림판 (마우스/터치/펜 모두 지원)
// ---------------------------------------------------------------
const 판 = document.getElementById("판");
const 붓 = 판.getContext("2d", { willReadFrequently: true });
const 붓굵기 = 18;
let 그리는중 = false, 이전 = null;

function 초기화() {
  붓.fillStyle = "#000"; 붓.fillRect(0, 0, 판.width, 판.height);
  붓.strokeStyle = "#fff"; 붓.lineWidth = 붓굵기; 붓.lineCap = "round"; 붓.lineJoin = "round";
}
function 좌표(e) {
  const r = 판.getBoundingClientRect();
  return { x: (e.clientX - r.left) * 판.width / r.width, y: (e.clientY - r.top) * 판.height / r.height };
}
판.addEventListener("pointerdown", e => { 그리는중 = true; 이전 = 좌표(e); 판.setPointerCapture(e.pointerId);
  붓.beginPath(); 붓.moveTo(이전.x, 이전.y); 붓.lineTo(이전.x + 0.01, 이전.y); 붓.stroke(); });
판.addEventListener("pointermove", e => {
  if (!그리는중) return;
  const p = 좌표(e); 붓.beginPath(); 붓.moveTo(이전.x, 이전.y); 붓.lineTo(p.x, p.y); 붓.stroke(); 이전 = p;
});
["pointerup", "pointercancel"].forEach(n => 판.addEventListener(n, () => 그리는중 = false));
초기화();

// ---------------------------------------------------------------
// 2. 전처리: 글씨 영역만 잘라 긴 변 20px로 줄이고 28x28 가운데에 배치 (MNIST 방식)
// ---------------------------------------------------------------
function 전처리() {
  const 원본 = 붓.getImageData(0, 0, 판.width, 판.height).data;
  let 위 = 1e9, 아래 = -1, 왼 = 1e9, 오른 = -1;
  for (let y = 0; y < 판.height; y++) for (let x = 0; x < 판.width; x++) {
    if (원본[(y * 판.width + x) * 4] > 50) { 위 = Math.min(위, y); 아래 = Math.max(아래, y); 왼 = Math.min(왼, x); 오른 = Math.max(오른, x); }
  }
  if (아래 < 0) return null; // 아무것도 안 그림
  const 가로 = 오른 - 왼 + 1, 세로 = 아래 - 위 + 1, 비율 = 20 / Math.max(가로, 세로);
  const 새가로 = Math.max(1, Math.round(가로 * 비율)), 새세로 = Math.max(1, Math.round(세로 * 비율));
  const 작은판 = document.createElement("canvas"); 작은판.width = 28; 작은판.height = 28;
  const 작은붓 = 작은판.getContext("2d");
  작은붓.fillStyle = "#000"; 작은붓.fillRect(0, 0, 28, 28);
  작은붓.imageSmoothingQuality = "high";
  작은붓.drawImage(판, 왼, 위, 가로, 세로, Math.floor((28 - 새가로) / 2), Math.floor((28 - 새세로) / 2), 새가로, 새세로);
  const 픽셀 = 작은붓.getImageData(0, 0, 28, 28).data;
  const 입력 = new Float32Array(784);
  for (let i = 0; i < 784; i++) 입력[i] = (픽셀[i * 4] / 255 - 0.1307) / 0.3081; // 학습 때와 같은 정규화
  return 입력;
}

// ---------------------------------------------------------------
// 3. CNN 순전파 (train_mnist.py 의 구조와 동일)
// ---------------------------------------------------------------
// 3x3 합성곱 (padding=1). 가중치 배치: [출력채널][입력채널][3][3]
function 합성곱(입력, 입채, 출채, H, W, 가중치, 편향) {
  const 출력 = new Float32Array(출채 * H * W);
  for (let o = 0; o < 출채; o++) for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let 합 = 편향[o];
    for (let c = 0; c < 입채; c++) for (let ky = 0; ky < 3; ky++) {
      const yy = y + ky - 1; if (yy < 0 || yy >= H) continue;
      for (let kx = 0; kx < 3; kx++) {
        const xx = x + kx - 1; if (xx < 0 || xx >= W) continue;
        합 += 입력[(c * H + yy) * W + xx] * 가중치[((o * 입채 + c) * 3 + ky) * 3 + kx];
      }
    }
    출력[(o * H + y) * W + x] = 합;
  }
  return 출력;
}
const 렐루 = a => { for (let i = 0; i < a.length; i++) if (a[i] < 0) a[i] = 0; return a; };
function 풀링(입력, 채널, H, W) { // 2x2 최대 풀링
  const h = H / 2, w = W / 2, 출력 = new Float32Array(채널 * h * w);
  for (let c = 0; c < 채널; c++) for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const b = (c * H + y * 2) * W + x * 2;
    출력[(c * h + y) * w + x] = Math.max(입력[b], 입력[b + 1], 입력[b + W], 입력[b + W + 1]);
  }
  return 출력;
}
function 완전연결(입력, 입수, 출수, 가중치, 편향) {
  const 출력 = new Float32Array(출수);
  for (let o = 0; o < 출수; o++) { let 합 = 편향[o]; for (let i = 0; i < 입수; i++) 합 += 입력[i] * 가중치[o * 입수 + i]; 출력[o] = 합; }
  return 출력;
}
function 소프트맥스(a) {
  const m = Math.max(...a), e = Array.from(a, v => Math.exp(v - m)), s = e.reduce((p, q) => p + q, 0);
  return e.map(v => v / s);
}
function 순전파(입력, W) {
  let x = 렐루(합성곱(입력, 1, 32, 28, 28, W["합성곱1.weight"], W["합성곱1.bias"]));
  x = 풀링(x, 32, 28, 28);
  x = 렐루(합성곱(x, 32, 64, 14, 14, W["합성곱2.weight"], W["합성곱2.bias"]));
  x = 풀링(x, 64, 14, 14);                       // (64, 7, 7) → 펼치면 3136개
  x = 렐루(완전연결(x, 3136, 128, W["완전연결1.weight"], W["완전연결1.bias"]));
  return 소프트맥스(완전연결(x, 128, 10, W["완전연결2.weight"], W["완전연결2.bias"]));
}

// ---------------------------------------------------------------
// 4. 화면 연결
// ---------------------------------------------------------------
let 가중치 = null;
const 막대들 = document.getElementById("막대들");
for (let i = 0; i < 10; i++) 막대들.insertAdjacentHTML("beforeend",
  `<div class="막대줄"><span>${i}</span><div class="바탕"><div class="채움" id="채움${i}"></div></div><span class="퍼센트" id="퍼센트${i}">0%</span></div>`);

const 상태 = document.getElementById("상태");

// 불러온 JSON 데이터를 검사하고 모델 가중치로 적용
function 가중치_적용(데이터, 이름) {
  for (const 키 of ["합성곱1.weight", "합성곱2.weight", "완전연결1.weight", "완전연결2.weight"])
    if (!데이터[키]) throw new Error("필요한 층이 없습니다: " + 키);
  for (const 키 in 데이터) 데이터[키] = Float32Array.from(데이터[키]);
  가중치 = 데이터;
  상태.textContent = "가중치 불러오기 완료 ✓ (" + 이름 + ")";
}

// 페이지가 열리면 같은 폴더의 mnist_cnn.json 을 자동으로 불러옴
(async () => {
  try {
    const 응답 = await fetch("mnist_cnn.json");
    if (!응답.ok) throw new Error("파일을 찾지 못했습니다 (" + 응답.status + ")");
    가중치_적용(await 응답.json(), "mnist_cnn.json");
  } catch (err) {
    // 자동 불러오기가 안 되면(예: 파일을 더블클릭으로 연 경우) 아래 버튼으로 직접 선택
    상태.textContent = "자동 불러오기 실패: 아래 버튼으로 mnist_cnn.json 을 직접 선택하세요.";
  }
})();

// 직접 선택한 파일 불러오기 (자동 불러오기가 안 될 때 사용)
document.getElementById("파일").addEventListener("change", async e => {
  const 파일 = e.target.files[0]; if (!파일) return;
  try { 가중치_적용(JSON.parse(await 파일.text()), 파일.name); }
  catch (err) { 가중치 = null; 상태.textContent = "불러오기 실패: " + err.message; }
});

document.getElementById("지우기버튼").onclick = () => {
  초기화(); document.getElementById("결과").textContent = "?"; document.getElementById("확신").textContent = "숫자를 쓰고 '인식'을 누르세요";
  for (let i = 0; i < 10; i++) { document.getElementById("채움" + i).style.width = "0"; document.getElementById("퍼센트" + i).textContent = "0%"; }
};
document.getElementById("인식버튼").onclick = () => {
  const 확신칸 = document.getElementById("확신");
  if (!가중치) { 확신칸.textContent = "먼저 가중치 JSON 파일을 불러오세요."; return; }
  const 입력 = 전처리();
  if (!입력) { 확신칸.textContent = "글씨가 없습니다. 숫자를 써 주세요."; return; }
  const 확률 = 순전파(입력, 가중치), 숫자 = 확률.indexOf(Math.max(...확률));
  document.getElementById("결과").textContent = 숫자;
  확신칸.textContent = "확신도 " + (확률[숫자] * 100).toFixed(1) + "%";
  확률.forEach((p, i) => { document.getElementById("채움" + i).style.width = (p * 100) + "%"; document.getElementById("퍼센트" + i).textContent = (p * 100).toFixed(0) + "%"; });
};
</script>
</body>
</html>
